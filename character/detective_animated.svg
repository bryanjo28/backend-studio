<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="600" height="600" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Detektif animasi</title>
  <style>
    svg * { transform-box: view-box; }
    .bob      { animation: bob 2.4s ease-in-out infinite; }
    .shadow   { transform-origin: 627px 1105px; animation: shadow 2.4s ease-in-out infinite; }
    .head     { transform-origin: 627px 520px; animation: tilt 4.8s ease-in-out infinite; }
    .hat      { transform-origin: 627px 300px; animation: hat 4.8s ease-in-out infinite; }
    .coatL    { transform-origin: 530px 575px; animation: swayL 2.4s ease-in-out infinite; }
    .coatR    { transform-origin: 735px 590px; animation: swayR 2.4s ease-in-out infinite; }
    .tie      { transform-origin: 627px 565px; animation: tie 2.4s ease-in-out infinite; }
    .eyeL     { transform-origin: 570px 410px; animation: blink 4s infinite; }
    .eyeR     { transform-origin: 693px 410px; animation: blink 4s infinite; }
    .look     { animation: look 6s ease-in-out infinite; }
    .brow     { animation: brow 6s ease-in-out infinite; transform-origin: 627px 380px; }
    @keyframes bob    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.92); opacity: .75; } }
    @keyframes tilt   { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2.2deg); } }
    @keyframes hat    { 0%,100% { transform: translateY(0) rotate(0deg); } 45% { transform: translateY(-7px) rotate(1.5deg); } 60% { transform: translateY(-3px) rotate(-1deg); } }
    @keyframes swayL  { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(1.4deg); } }
    @keyframes swayR  { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-1.4deg); } }
    @keyframes tie    { 0%,100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
    @keyframes blink  { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
    @keyframes look   { 0%,20%,100% { transform: translateX(0); } 35%,55% { transform: translateX(7px); } 70%,85% { transform: translateX(-7px); } }
    @keyframes brow   { 0%,60%,100% { transform: translateY(0); } 70%,80% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { svg * { animation: none !important; } }
  </style>

  <rect width="1254" height="1254" fill="#ffffff"/>

  <!-- Bayangan -->
  <ellipse class="shadow" cx="627" cy="1105" rx="225" ry="28" fill="#b9b7cf"/>

  <g class="bob">
    <!-- Sepatu -->
    <path d="M478 1090 Q480 1060 520 1055 L585 1055 L590 1100 L588 1115 L478 1118 Z" fill="#8a5a33" stroke="#4a2c17" stroke-width="5" stroke-linejoin="round"/>
    <path d="M665 1055 L735 1055 Q775 1062 780 1095 L778 1115 L668 1115 Z" fill="#8a5a33" stroke="#4a2c17" stroke-width="5" stroke-linejoin="round"/>

    <!-- Celana -->
    <path d="M540 770 L650 770 L655 1030 L520 1030 Z" fill="#33333f" stroke="#1d1d26" stroke-width="5" stroke-linejoin="round"/>
    <path d="M600 770 L725 770 L728 1030 L656 1030 Z" fill="#3a3a47" stroke="#1d1d26" stroke-width="5" stroke-linejoin="round"/>
    <rect x="518" y="1020" width="80" height="36" rx="4" fill="#2c2c37" stroke="#1d1d26" stroke-width="5"/>
    <rect x="656" y="1020" width="78" height="36" rx="4" fill="#2c2c37" stroke="#1d1d26" stroke-width="5"/>

    <!-- Lapisan dalam mantel -->
    <path d="M598 770 L662 770 L690 945 L570 945 Z" fill="#5a3a22"/>

    <!-- Kemeja -->
    <path d="M590 535 L665 535 L662 745 L592 745 Z" fill="#fbfbfb" stroke="#9a9aa5" stroke-width="3"/>
    <path d="M590 535 L627 572 L665 535 L650 560 L627 585 L603 560 Z" fill="#e8e8ee" stroke="#9a9aa5" stroke-width="3" stroke-linejoin="round"/>

    <!-- Dasi -->
    <g class="tie">
      <path d="M612 565 L642 565 L648 600 L650 690 L627 732 L606 690 L608 600 Z" fill="#26262e" stroke="#101016" stroke-width="3" stroke-linejoin="round"/>
      <path d="M612 560 L642 560 L644 580 L610 580 Z" fill="#33333d"/>
    </g>

    <!-- Sabuk -->
    <rect x="590" y="742" width="76" height="28" fill="#6b4023" stroke="#3a2210" stroke-width="4"/>
    <rect x="610" y="745" width="36" height="22" rx="3" fill="none" stroke="#d9a441" stroke-width="6"/>

    <!-- Mantel kiri -->
    <g class="coatL">
      <path d="M530 575 L455 690 L480 770 L510 800 L480 900 L470 935 L595 968 L602 780 L592 600 L550 545 Z" fill="#9a6338" stroke="#5a3519" stroke-width="5" stroke-linejoin="round"/>
      <path d="M520 560 L560 540 L592 602 L600 692 L545 612 Z" fill="#b57a47" stroke="#5a3519" stroke-width="4" stroke-linejoin="round"/>
      <path d="M500 800 L545 760 L560 830 L525 840 Z" fill="#8a5630" stroke="#5a3519" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="571" cy="742" r="8" fill="#3a2210"/>
      <circle cx="562" cy="848" r="8" fill="#3a2210"/>
      <path d="M505 792 Q512 770 530 778 L520 805 Z" fill="#f6c9a0" stroke="#7a4a2a" stroke-width="3"/>
    </g>

    <!-- Mantel kanan -->
    <g class="coatR">
      <path d="M735 590 L800 700 L775 770 L748 800 L770 880 L790 930 L680 962 L662 780 L668 600 L700 540 Z" fill="#9a6338" stroke="#5a3519" stroke-width="5" stroke-linejoin="round"/>
      <path d="M734 560 L694 540 L664 602 L655 692 L712 612 Z" fill="#b57a47" stroke="#5a3519" stroke-width="4" stroke-linejoin="round"/>
      <path d="M750 800 L715 758 L705 830 L735 840 Z" fill="#8a5630" stroke="#5a3519" stroke-width="4" stroke-linejoin="round"/>
      <path d="M748 790 Q742 770 725 778 L733 805 Z" fill="#f6c9a0" stroke="#7a4a2a" stroke-width="3"/>
    </g>

    <!-- Kepala -->
    <g class="head">
      <!-- Telinga -->
      <ellipse cx="480" cy="435" rx="28" ry="36" fill="#f6c9a0" stroke="#7a4a2a" stroke-width="5"/>
      <ellipse cx="773" cy="435" rx="28" ry="36" fill="#f6c9a0" stroke="#7a4a2a" stroke-width="5"/>
      <!-- Wajah -->
      <path d="M510 400 Q510 330 627 322 Q745 330 745 400 L742 470 Q735 525 627 530 Q520 525 512 470 Z" fill="#f8cfa6" stroke="#7a4a2a" stroke-width="5" stroke-linejoin="round"/>
      <!-- Rambut -->
      <path d="M458 335 L505 330 L515 440 L500 440 Q465 420 458 335 Z" fill="#3a2418"/>
      <path d="M745 330 L795 335 Q790 420 760 440 L742 440 Z" fill="#3a2418"/>
      <path d="M512 350 Q560 335 625 340 Q700 305 745 345 L745 395 Q730 365 690 358 Q640 352 600 360 Q545 365 520 410 Z" fill="#3a2418"/>

      <!-- Pipi -->
      <ellipse cx="552" cy="458" rx="28" ry="15" fill="#f2a58b" opacity=".75"/>
      <ellipse cx="708" cy="458" rx="28" ry="15" fill="#f2a58b" opacity=".75"/>

      <!-- Mata -->
      <g class="eyeL">
        <ellipse cx="570" cy="410" rx="38" ry="40" fill="#1d1a1f"/>
        <g class="look">
          <circle cx="581" cy="397" r="10" fill="#fff"/>
          <circle cx="561" cy="426" r="5" fill="#fff"/>
        </g>
      </g>
      <g class="eyeR">
        <ellipse cx="693" cy="410" rx="38" ry="40" fill="#1d1a1f"/>
        <g class="look">
          <circle cx="704" cy="397" r="10" fill="#fff"/>
          <circle cx="684" cy="426" r="5" fill="#fff"/>
        </g>
      </g>

      <!-- Alis -->
      <g class="brow" fill="none" stroke="#3a2418" stroke-width="15" stroke-linecap="round">
        <path d="M528 372 Q560 355 605 380"/>
        <path d="M650 380 Q695 355 728 368"/>
      </g>

      <!-- Hidung & senyum -->
      <path d="M622 438 Q628 446 636 440" fill="none" stroke="#c98a62" stroke-width="4" stroke-linecap="round"/>
      <path d="M603 468 Q627 487 652 468" fill="none" stroke="#a8553a" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Topi -->
      <g class="hat">
        <path d="M495 290 Q488 190 530 148 Q560 128 620 135 Q655 152 700 135 Q748 142 762 205 Q776 250 778 285 Z" fill="#a9703f" stroke="#4a2c17" stroke-width="5" stroke-linejoin="round"/>
        <path d="M620 135 Q655 152 700 135 Q748 142 762 205 Q776 250 778 285 L640 285 Q650 200 620 135 Z" fill="#9a6335" opacity=".7"/>
        <path d="M485 270 L478 232 Q620 250 765 228 L778 270 Z" fill="#2b2b35" stroke="#15151b" stroke-width="4" stroke-linejoin="round"/>
        <path d="M398 322 Q394 292 470 284 L780 262 Q850 275 852 300 Q842 345 700 355 Q520 368 422 345 Q400 340 398 322 Z" fill="#a3683a" stroke="#4a2c17" stroke-width="5" stroke-linejoin="round"/>
        <path d="M420 345 Q520 368 700 355 Q842 345 850 305 Q830 335 700 340 Q520 352 420 330 Z" fill="#7a4a25" opacity=".6"/>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
